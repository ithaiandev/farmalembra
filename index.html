<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entrar · FarmaLembra</title>
  <meta name="theme-color" content="#0b63c5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icone-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Guarda o endereço antes do Supabase limpar (links de convite / recuperar senha)
    window.__hashInicial = location.hash;
    try {
      const t = localStorage.getItem('tema');
      if (t === 'escuro' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.tema = 'escuro';
      }
    } catch (e) {}
  </script>
</head>
<body>
  <main class="tela-login">
    <div class="caixa-login">
      <div class="logo">
        <img src="img/logo.svg" alt="" data-logo>
        <h1 data-nome-farmacia>Farmamax</h1>
        <span class="suave pequeno">Lembretes de uso contínuo</span>
      </div>

      <div class="aviso oculto" data-aviso></div>

      <!-- Entrar -->
      <form data-tela="entrar" novalidate>
        <label class="campo"><span>E-mail</span>
          <input type="email" name="email" autocomplete="username" required inputmode="email"></label>
        <label class="campo"><span>Senha</span>
          <input type="password" name="senha" autocomplete="current-password" required></label>
        <button type="submit" class="btn btn-primario btn-grande btn-bloco">Entrar</button>
        <p class="rodape"><a href="#" data-ir="recuperar">Esqueci minha senha</a></p>
      </form>

      <!-- Recuperar senha -->
      <form data-tela="recuperar" class="oculto" novalidate>
        <p>Digite seu e-mail. Vamos enviar um link para criar uma nova senha.</p>
        <label class="campo"><span>E-mail</span>
          <input type="email" name="email" autocomplete="username" required inputmode="email"></label>
        <button type="submit" class="btn btn-primario btn-grande btn-bloco">Enviar link</button>
        <p class="rodape"><a href="#" data-ir="entrar">Voltar para o login</a></p>
      </form>

      <!-- Definir nova senha (link do e-mail de convite ou recuperação) -->
      <form data-tela="nova-senha" class="oculto" novalidate>
        <p><strong>Crie sua senha</strong> para acessar o sistema.</p>
        <label class="campo"><span>Nova senha (mínimo 8 caracteres)</span>
          <input type="password" name="senha" autocomplete="new-password" minlength="8" required></label>
        <label class="campo"><span>Repita a senha</span>
          <input type="password" name="senha2" autocomplete="new-password" minlength="8" required></label>
        <button type="submit" class="btn btn-verde btn-grande btn-bloco">Salvar senha e entrar</button>
      </form>

      <p class="rodape"><a href="privacidade.html">Política de Privacidade</a></p>
    </div>
  </main>

  <script type="module">
    import { supabase, configurado } from './js/supabase.js';
    import { CONFIG } from './js/config.js';
    import { entrar, recuperarSenha, definirNovaSenha } from './js/auth.js';
    import { toast, comBotaoOcupado } from './js/ui.js';

    const $ = (s) => document.querySelector(s);
    const aviso = $('[data-aviso]');
    $('[data-nome-farmacia]').textContent = CONFIG.NOME_FARMACIA;
    if (CONFIG.LOGO_URL) $('[data-logo]').src = CONFIG.LOGO_URL;

    function mostrar(tela) {
      document.querySelectorAll('[data-tela]').forEach((f) => f.classList.toggle('oculto', f.dataset.tela !== tela));
      $(`[data-tela="${tela}"] input`)?.focus();
    }
    function avisar(texto, tipo = '') {
      aviso.className = `aviso ${tipo}`;
      aviso.textContent = texto;
    }
    document.querySelectorAll('[data-ir]').forEach((a) =>
      a.addEventListener('click', (e) => { e.preventDefault(); aviso.className = 'aviso oculto'; mostrar(a.dataset.ir); }));

    if (!configurado) {
      avisar('Sistema ainda não configurado: abra o arquivo js/config.js e coloque a URL e a anon key do Supabase (veja o README).');
    }

    const params = new URLSearchParams(location.search);
    if (params.get('motivo') === 'inativo') avisar('Seu acesso está desativado ou ainda não foi liberado. Fale com o administrador.');
    if (params.get('motivo') === 'erro') avisar('Não foi possível carregar seu perfil. Verifique se o SQL foi executado no Supabase.');

    // Veio de um link de convite ou de recuperação de senha?
    const hash = window.__hashInicial || '';
    const precisaSenha = /type=(recovery|invite|signup)/.test(hash);
    if (/error_description=/.test(hash)) {
      const msg = decodeURIComponent((hash.match(/error_description=([^&]+)/) || [])[1] || '').replace(/\+/g, ' ');
      avisar('O link não é mais válido: ' + msg + '. Peça um novo.');
    }

    let recuperando = false;
    supabase.auth.onAuthStateChange((evento) => {
      if (evento === 'PASSWORD_RECOVERY') { recuperando = true; mostrar('nova-senha'); }
    });

    const { data: { session } } = await supabase.auth.getSession();
    if ((precisaSenha || recuperando) && session) mostrar('nova-senha');
    else if (session && !params.get('motivo')) location.replace('app.html');

    // Entrar
    $('[data-tela="entrar"]').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.currentTarget;
      if (!f.reportValidity()) return;
      await comBotaoOcupado(f.querySelector('button'), async () => {
        try {
          await entrar(f.email.value.trim(), f.senha.value);
          location.replace('app.html');
        } catch (erro) {
          avisar(/invalid/i.test(erro.message) ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + erro.message);
        }
      }, 'Entrando...');
    });

    // Recuperar
    $('[data-tela="recuperar"]').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.currentTarget;
      if (!f.reportValidity()) return;
      await comBotaoOcupado(f.querySelector('button'), async () => {
        try {
          await recuperarSenha(f.email.value.trim());
          avisar('Se o e-mail estiver cadastrado, você vai receber o link em alguns minutos. Confira também o spam.', 'ok');
          mostrar('entrar');
        } catch (erro) {
          avisar('Não foi possível enviar: ' + erro.message);
        }
      }, 'Enviando...');
    });

    // Nova senha
    $('[data-tela="nova-senha"]').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.currentTarget;
      if (!f.reportValidity()) return;
      if (f.senha.value !== f.senha2.value) return avisar('As senhas não são iguais.');
      await comBotaoOcupado(f.querySelector('button'), async () => {
        try {
          await definirNovaSenha(f.senha.value);
          toast('Senha salva!');
          history.replaceState(null, '', location.pathname);
          location.replace('app.html');
        } catch (erro) {
          avisar('Não foi possível salvar a senha: ' + erro.message);
        }
      }, 'Salvando...');
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
