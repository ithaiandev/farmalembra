<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Segurança (CSP): só aceita scripts deste site e da biblioteca do Supabase; nada escrito direto na página -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Promoção</title>
  <meta name="theme-color" content="#0b63c5">
  <!--
    Prévia do link no WhatsApp: o WhatsApp lê estas linhas (sem rodar JavaScript).
    A "capa" (og:image) é a 1ª imagem da última campanha salva — o sistema troca
    o arquivo capa.jpg sozinho ao salvar a campanha.
    Para outra farmácia: troque o endereço do Supabase em og:image.
  -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="📸 Fotos da promoção">
  <meta property="og:description" content="Toque para ver as imagens da promoção da farmácia.">
  <meta property="og:image" content="https://hydqyhahyopiykcvgcvf.supabase.co/storage/v1/object/public/campanhas/capa.jpg">
  <meta property="og:image:secure_url" content="https://hydqyhahyopiykcvgcvf.supabase.co/storage/v1/object/public/campanhas/capa.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="Imagem da promoção">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Página pública: só as fotos da promoção (sem login, sem dados de clientes) */
    .promo-topo {
      background: linear-gradient(110deg, #0b63c5 0%, #0a7aa0 60%, #0a8f6a 100%);
      color: #fff; text-align: center; padding: 22px 16px 18px;
    }
    .promo-topo h1 { margin: 0; font-size: 1.5rem; }
    .promo-topo p { margin: 4px 0 0; opacity: .9; }
    .promo { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
    .promo-fotos { display: grid; gap: 14px; }
    .promo-fotos img {
      display: block; width: 100%; height: auto; border-radius: var(--raio);
      box-shadow: var(--sombra); background: var(--superficie-2);
    }
    .promo-info { text-align: center; margin-top: 20px; }
    .promo-info .btn { margin-top: 10px; }
    .promo-rodape { text-align: center; margin-top: 26px; font-size: .8rem; color: var(--texto-suave); }
  </style>
  <script src="js/inicio.js"></script>
</head>
<body>
  <header class="promo-topo">
    <h1 data-nome>Promoção</h1>
    <p>📸 Confira as fotos da promoção</p>
  </header>

  <main class="promo">
    <div class="promo-fotos" data-fotos><div class="carregando"><span class="spinner"></span>Carregando fotos...</div></div>

    <div class="promo-info oculto" data-info>
      <p data-endereco></p>
      <a class="btn btn-whats btn-grande oculto" data-whats target="_blank" rel="noopener">💬 Falar com a farmácia</a>
    </div>

    <p class="promo-rodape">Promoção válida enquanto durarem os estoques. · FarmaLembra</p>
  </main>

  <script type="module" src="js/promo.js"></script>
</body>
</html>
